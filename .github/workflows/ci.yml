# Build + SwiftLint solo en PRs hacia `develop`.
# `main` / `master`: sin este workflow (merge directo sin checks ni jobs en GitHub Actions).
# Push a `develop` no dispara CI (checks en el PR a develop); TestFlight: testflight.yml (solo en `main` o a mano).
name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Xcode (misma línea que TestFlight / App Store)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Crear pagosApp/Config/Secrets.xcconfig desde template
        run: cp Config/Secrets.template.xcconfig pagosApp/Config/Secrets.xcconfig

      - name: Build + Unit Tests
        run: |
          xcodebuild -scheme pagosApp \
            -project pagosApp.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone Air' \
            -configuration Debug \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            test

  swiftlint:
    name: SwiftLint
    # Linux: no necesita macOS ni Xcode, y evita quedarse en cola esperando un runner macos-26
    # (el job llegó a cancelarse a los 15 min sin ejecutar ningún paso).
    # Se usa la imagen oficial de SwiftLint: trae sus librerías (libxml2, etc.), que el runner no garantiza.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.58.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}" \
            swiftlint lint --reporter github-actions-logging
